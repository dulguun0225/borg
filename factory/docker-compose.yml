# Dev PostgreSQL for the factory. Tests read DATABASE_URL and default to this
# instance: postgres://factory:factory@localhost:5433/factory
# Port 5433 on the host so a locally installed Postgres on 5432 is untouched.
services:
  postgres:
    image: postgres:17
    # Every database test applies the whole schema into a schema of its own and
    # drops it after, and go test runs one package per core with the tests inside
    # each in parallel. A drop takes a lock per object it removes, and the lock
    # table the default sizes — 64 per connection — runs out under that load with
    # "out of shared memory". The tests do not skip, so the table is sized here.
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports:
      - "5433:5432"
    volumes:
      - factory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  factory-pgdata:
