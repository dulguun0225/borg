# Every check and test, on a PostgreSQL the workflow starts. The
# database tests do not skip when the database is unreachable, so a service
# container that fails to start fails the run rather than turning it green.
#
# -count=1 is what makes that true, and it is not a habit: go test caches a
# result against the test binary, the command line, and the files and
# environment variables the test read, none of which is the database. A
# re-run of the same commit therefore reports the cached ok without opening a
# socket, and setup-go restores GOCACHE keyed on go.sum, which does not change
# between those re-runs. Without the flag a run with no database at all is
# green.
name: factory

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: factory

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    # The drift detector's store is a URL of its own: the same server here, a
    # schema of its own, the way factory/driftdetector's doc.go describes it.
    env:
      DATABASE_URL: postgres://factory:factory@localhost:5432/factory
      DRIFTDETECTOR_DATABASE_URL: postgres://factory:factory@localhost:5432/factory?search_path=driftdetector

    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in two files that have to agree: mise.toml is
      # what a developer's shell reads, go.mod is what this workflow reads.
      - name: mise.toml and go.mod name the same Go
        run: |
          mise=$(sed -n 's/^go = "\(.*\)"$/\1/p' ../mise.toml)
          mod=$(sed -n 's/^go \(.*\)$/\1/p' go.mod)
          echo "mise.toml names $mise, go.mod names $mod"
          [ -n "$mise" ] && [ "$mise" = "$mod" ]

      - uses: actions/setup-go@v5
        with:
          go-version-file: factory/go.mod
          cache-dependency-path: factory/go.sum

      # The client is the second toolchain, pinned in the same mise.toml and
      # read from it here the way the Go step reads it. It is built before the
      # Go steps because factory/clientdist embeds whatever browser/ holds, so
      # the Go tests run against the client this commit produces rather than
      # against an empty directory.
      - name: mise.toml names the client's Node
        id: node
        run: |
          mise=$(sed -n 's/^node = "\(.*\)"$/\1/p' ../mise.toml)
          echo "mise.toml names node $mise"
          [ -n "$mise" ]
          echo "version=$mise" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: factory/client/package-lock.json

      - name: the client installs exactly its lockfile
        working-directory: factory/client
        run: npm ci

      # The client carries the factory version on every call and the server
      # refuses a call whose version is not its own, so the constant in the
      # client and the constant in the binary have to agree. set-version
      # copies one to the other; a diff here means they had drifted.
      - name: the client and the binary name the same factory version
        working-directory: factory/client
        run: |
          npm run set-version
          git diff --exit-code src/environments/version.ts

      - name: the client's lint wall
        working-directory: factory/client
        run: npm run lint

      - name: the client's tests
        working-directory: factory/client
        run: npm test

      - name: the client's build
        working-directory: factory/client
        run: npm run build

      - run: go vet ./...

      - run: go run ./cmd/depscheck

      - run: go run ./cmd/tracecheck

      # The design document's own checks, the fence in end-goal/CLAUDE.md, run
      # from the repository root so their readings are in this log. The script
      # has no set -e, so the step's exit status is the fence's last command,
      # the tracecheck run the step before already makes; the fence's gates
      # fail the session that edits the document, not this job. Appending a
      # command to the fence changes what this step's exit status means.
      - name: the design document's consistency commands
        working-directory: .
        run: tools/consistency-commands.sh

      - run: go test -count=1 ./...
